# The operations console on its own.
#
#   docker compose up -d                          # console on :3000
#   docker compose --profile tools run --rm test  # the unit tests
#
# The browser uses /api/backend on the site's own origin. Next.js forwards
# requests to the host's backend. BACKEND_API_URL is captured at build time;
# rebuild the web image when changing that address.

name: zonegate-web

services:
  web:
    build:
      context: ./zonegate-web
      args:
        NEXT_PUBLIC_API_URL: /api/backend
        BACKEND_API_URL: ${BACKEND_API_URL:-http://host.docker.internal:8000}
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  test:
    build:
      context: ./zonegate-web
      target: builder
    command: ["npx", "vitest", "run"]
    profiles: ["tools"]
