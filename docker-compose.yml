# The operations console on its own.
#
#   docker compose up -d                          # console on :3000
#   docker compose --profile tools run --rm test  # the unit tests
#
# The console is a browser app: it talks to the API from the visitor's browser,
# not from this container. NEXT_PUBLIC_API_URL therefore has to be an address
# the browser can reach, and Next inlines it at build time -- changing it means
# rebuilding, not restarting.
#
# With the backend running from its own compose file on the same machine, the
# default below is already correct.

name: zonegate-web

services:
  web:
    build:
      context: ./zonegate-web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
    ports:
      - "3000:3000"
    restart: unless-stopped

  test:
    build:
      context: ./zonegate-web
      target: builder
    command: ["npx", "vitest", "run"]
    profiles: ["tools"]
